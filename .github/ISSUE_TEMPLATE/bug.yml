name: 버그
description: 의도와 다르게 동작하는 것
title: "[fix] "
labels: ["type: fix"]
body:
  - type: textarea
    id: symptom
    attributes:
      label: 증상
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 재현 방법
      value: |
        1.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 기대한 동작
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: 환경
      description: 브라우저, OS, 배포 환경 등
