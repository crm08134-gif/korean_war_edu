name: 전선 스냅샷
description: 전환점 전선 스냅샷 하나를 만들거나 고치는 작업
title: "[data] YYYY-MM-DD 스냅샷"
labels: ["type: data", "area: data"]
body:
  - type: input
    id: date
    attributes:
      label: 스냅샷 날짜
      placeholder: "1950-08-04"
    validations:
      required: true
  - type: input
    id: event
    attributes:
      label: 전환점 사건
      placeholder: "낙동강 방어선 형성"
    validations:
      required: true
  - type: textarea
    id: source
    attributes:
      label: 근거 지도
      description: CMH 지도 이름과 출처 URL (퍼블릭 도메인 원본만)
    validations:
      required: true
  - type: textarea
    id: crosscheck
    attributes:
      label: 교차 검수 자료
      description: 미 육군사관학교 아틀라스, 트루먼 도서관 지도 등
  - type: textarea
    id: todo
    attributes:
      label: 할 일
      value: |
        - [ ] 원본 지도 지오레퍼런싱
        - [ ] 전선 트레이싱 (LineString 하나, 서→동)
        - [ ] 고립 지역·교두보가 있으면 추가 영역으로 그리기
        - [ ] 교차 검수, 차이는 메모로 기록
        - [ ] PR에 근거 지도와 변경 이유 기록
