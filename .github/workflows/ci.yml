# PR을 올리거나 main에 머지될 때마다 백엔드와 프론트를 빌드하고 검사한다.
name: CI

on:
  pull_request:          # 모든 PR (어느 브랜치에서 오든)
  push:
    branches: [main]     # 머지된 뒤의 main도 한 번 더 확인

# 이 워크플로는 코드를 읽기만 한다 (최소 권한)
permissions:
  contents: read

jobs:
  backend:
    name: backend build  # 브랜치 보호의 "필수 체크"에서 이 이름으로 찾는다
    runs-on: ubuntu-latest   # Docker가 들어 있어서 Testcontainers가 그대로 돈다
    defaults:
      run:
        working-directory: backend   # 아래 run 명령은 backend/ 폴더에서 실행
    steps:
      - name: 코드 받기
        uses: actions/checkout@v7

      - name: JDK 25 설치
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - name: Gradle 준비 (캐시, wrapper 검증)
        uses: gradle/actions/setup-gradle@v6

      - name: 빌드와 테스트
        run: ./gradlew build

  frontend:
    name: frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_TELEMETRY_DISABLED: 1   # 빌드 통계를 Next.js에 보내지 않는다
    steps:
      - name: 코드 받기
        uses: actions/checkout@v7

      - name: Node.js LTS 설치
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 의존성 설치 (package-lock.json 그대로)
        run: npm ci

      - name: 린트
        run: npm run lint

      - name: 빌드 (타입 검사 포함)
        run: npm run build
