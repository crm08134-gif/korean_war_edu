spring:
  application:
    name: backend
  config:
    # 저장소 최상위 .env의 키들을 설정값으로 읽는다. 파일이 없으면 건너뛴다
    import: optional:file:../.env[.properties]
  docker:
    compose:
      file: ../compose.yaml
  jpa:
    # DB 연결을 화면 응답이 끝날 때까지 붙잡지 않는다. 지연 로딩은 서비스의 트랜잭션 안에서만 된다
    open-in-view: false
    hibernate:
      # 테이블은 Flyway가 만들고, Hibernate는 엔티티와 테이블이 맞는지 검사만 한다
      ddl-auto: validate
  mvc:
    # 오류를 {"status":409,"detail":"..."} 형식(RFC 9457)으로 낸다
    problemdetails:
      enabled: true
  security:
    oauth2:
      client:
        registration:
          kakao:
            client-id: ${KAKAO_CLIENT_ID}
            client-secret: ${KAKAO_CLIENT_SECRET}
            # 카카오는 비밀키를 요청 본문으로 받는다
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            # 돌아올 주소를 고정한다 (Host 머리글로 만들지 않는다)
            redirect-uri: ${APP_BASE_URL}/login/oauth2/code/kakao
            # scope 없음: 동의 항목 없이 회원 번호만 받는다
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            # 이름·이메일 없이 회원 번호(sub)만
            scope: openid
            redirect-uri: ${APP_BASE_URL}/login/oauth2/code/google
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id
auth:
  # 브라우저가 여는 주소. 로그인 뒤 돌아갈 곳
  base-url: ${APP_BASE_URL}
  # JWT 서명 키(Base64, 32바이트 이상). openssl rand -base64 32
  jwt-secret: ${JWT_SECRET}
events:
  include-drafts: false
