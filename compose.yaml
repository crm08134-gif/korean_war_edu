# 로컬 개발용 DB: PostgreSQL 18 + PostGIS 3.6
#   실행:            docker compose up -d
#   상태 확인:        docker compose ps
#   정지:            docker compose down
#   데이터까지 삭제:   docker compose down -v
# 접속 정보는 .env에서 읽는다 (.env.example을 복사해서 만든다).
name: korean-war-map

services:
  db:
    image: postgis/postgis:18-3.6
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-warmap}
      POSTGRES_USER: ${POSTGRES_USER:-warmap}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?.env에 POSTGRES_PASSWORD를 설정하세요}
    ports:
      # 내 컴퓨터(127.0.0.1)에서만 접속 가능하게 연다
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      # PostgreSQL 18 이미지부터 데이터 볼륨 위치가 /var/lib/postgresql로 바뀌었다
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db-data:
